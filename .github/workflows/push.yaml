name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  version-tag:
    name: Tag New Version 🏷️
    # A version in buildspec.json that has no tag yet becomes a release: the
    # tag is created on this commit and this same run builds and publishes it
    # (a tag pushed with the workflow token starts no run of its own).
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag 🏷️
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : Tag 🏷️
          version="$(jq -r '.version' buildspec.json)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)[0-9]*)?$ ]]; then
            echo "buildspec.json version '${version}' is not a release version; nothing to tag"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${version}" > /dev/null 2>&1; then
            echo "${version} is already tagged"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${version}" -f "sha=${GITHUB_SHA}" > /dev/null
          echo "Tagged ${version} on ${GITHUB_SHA}"
          echo "tag=${version}" >> "${GITHUB_OUTPUT}"

  build-project:
    name: Build Project 🧱
    needs: version-tag
    # Every push builds; version-tag only runs on main.
    if: ${{ !cancelled() && needs.version-tag.result != 'failure' }}
    uses: ./.github/workflows/build-project.yaml
    with:
      releaseTag: ${{ needs.version-tag.outputs.tag }}
    secrets: inherit
    permissions:
      # On a release tag the build creates the release and each platform job
      # attaches its own files as soon as it finishes.
      contents: write

  create-release:
    name: Add Release Checksums 🪪
    if: needs.build-project.outputs.releaseTag != ''
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Add Checksums 🪪
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-project.outputs.releaseTag }}
        run: |
          : Add Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # GitHub records each asset's SHA-256 on upload.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '"### Checksums", (.assets[] | "    \(.name): \(.digest // "" | ltrimstr("sha256:"))")' > CHECKSUMS.txt
          gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" --notes-file CHECKSUMS.txt
