Dock.Health.Title="Качество буфера снижено"
# %1×%2 buffered now, %3×%4 the full size, %5 the cause (Dock.Health.Cause.*), %6 the delay in seconds.
Dock.Health.Resolution="Буферизация идёт в %1×%2 вместо %3×%4, потому что %5. Ваша задержка %6 с не меняется."
