Dock.Canvas.Title="Задержка будет потреблять примерно вдвое больше ресурсов"
# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="Холст %1 тоже идёт с задержкой: OBS отправляет один и тот же звук на все холсты, поэтому сцена, которую он показывает (и любая из его сцен с тем же именем, что у сцены с задержкой), получает собственный видеобуфер. Пока задержка включена, ожидайте примерно вдвое больше нагрузки на ОЗУ, ЦП и видеокарту. Пока этот буфер заполняется и при каждой смене сцены на этом холсте он показывает чёрный экран на время задержки. Чтобы этого избежать, уберите этот холст из трансляции."

