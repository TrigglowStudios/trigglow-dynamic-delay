Stream.Buffer.Help="Где хранятся секунды, удерживаемые для задержки. Память: всё в ОЗУ, около 45 МБ в минуту при 6 Мбит/с; увеличение мгновенно в пределах вашей задержки, пресетов и правил сцен. Диск: более старые секунды уходят в зашифрованный временный файл, который удаляется по окончании трансляции; ОЗУ остаётся около 15 МБ, и любое увеличение до 600 с мгновенно, но вся трансляция записывается на диск (около 2,7 ГБ в час при 6 Мбит/с). В автоматическом режиме выбирается Память на SSD, чтобы избавить его от постоянной записи, и Диск на жёстком диске. Изменения начнут действовать со следующей трансляции."
