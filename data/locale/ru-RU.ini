Filter.AudioDelay.Name="Trigglow: буфер задержки звука"
# The filters' properties (OBS's Filters dialog): the dock manages both filters, so they have no fields.
Filter.VideoDelay.Managed="Управляется док-панелью Trigglow Dynamic Delay: там задаются задержка и минимальное качество, там же задержка включается и выключается."
