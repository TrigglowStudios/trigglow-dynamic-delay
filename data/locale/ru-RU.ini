# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Мультистрим и вертикальный формат"
Dock.Multistream.Tooltip="Когда задержка действует на весь OBS (этот флажок снят), с задержкой идут и все выходы основного холста: Aitum Multistream, Multiple RTMP Outputs и всё остальное, что кодирует показываемое в OBS, а сцена на холсте Aitum Vertical получает ту же задержку. С параметром «Применять задержку только к трансляции» через задержку идут собственная трансляция OBS и трансляция Aitum Vertical; выходы, которые запускают плагины мультистрима, идут в прямом эфире, и эта панель показывает их, пока они работают. Сервис, который принимает одну трансляцию и пересылает её дальше (Restream.io, Streamlabs Multistream, Trigglow Multistream), работает в обоих режимах."
Dock.ApplyTo.Stream="Применять задержку только к трансляции (запись и предпросмотр остаются без задержки)"
Dock.ApplyTo.Hint="Мало ОЗУ, и зрители всё равно видят сцену загрузки, пока накапливается задержка, но запись идёт без задержки."
Dock.ApplyTo.Tooltip="Выключено (по умолчанию): задержка действует на весь OBS. Пока она накапливается, показывается сцена загрузки, затем с задержкой идут и трансляция, и запись. Включено: с задержкой идёт только то, что уходит на вашу платформу. Запись, Буфер повтора и предпросмотр OBS остаются без задержки, зрители видят сцену загрузки, пока накапливается задержка (короткий клип, создаваемый в начале каждой трансляции), на «Передаче» может быть любая сцена, а ОЗУ и ЦП расходуется мало. Нужен выход RTMP или RTMPS самого OBS, включая Enhanced Broadcasting (не SRT и не WHIP). Если поставить флажок во время эфира, он начнёт действовать со следующей трансляции."
Dock.ApplyTo.Locked="Выключите задержку, чтобы изменить это."
Dock.ApplyTo.Unavailable="Пока недоступно на этой системе."
