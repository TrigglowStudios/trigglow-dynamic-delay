# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream eta bertikala"
Dock.Multistream.Tooltip="Delay-a OBS osoan dagoela (lauki hau markatu gabe), zure oihal nagusiaren irteera guztiak ere atzeratzen dira: Aitum Multistream, Multiple RTMP Outputs eta OBSk erakusten duena kodetzen duen beste edozer, eta Aitum Vertical oihal bateko eszenak delay bera jasotzen du. “Aplikatu delay-a zuzenekoari bakarrik” aukerarekin, OBSren beraren zuzenekoa eta Aitum Vertical-en zuzenekoa delay-tik pasatzen dira; multistream pluginek abiatzen dituzten irteerak zuzenean ateratzen dira, eta panel honek zerrendatzen ditu martxan dauden bitartean. Zuzeneko bakarra hartu eta birbidaltzen duen zerbitzu batek (Restream.io, Streamlabs Multistream, Trigglow Multistream) biekin funtzionatzen du."
Dock.ApplyTo.Stream="Aplikatu delay-a zuzenekoari bakarrik (grabazioa eta aurrebista zuzenean geratzen dira)"
Dock.ApplyTo.Hint="RAM gutxi, eta ikusleek karga-eszena ikusten dute oraindik delay-a pilatzen den bitartean, baina zure grabazioa ez da atzeratzen."
Dock.ApplyTo.Tooltip="Itzalita (lehenetsia): delay-a OBS osoari aplikatzen zaio. Zure karga-eszena erakusten da pilatzen den bitartean; gero zuzenekoa eta grabazioa, biak atzeratzen dira. Piztuta: zure plataformara doana bakarrik atzeratzen da. Grabazioa, Erreprodukzio bufferra eta OBSren aurrebista zuzenean geratzen dira, ikusleek karga-eszena ikusten dute delay-a pilatzen den bitartean (zuzeneko bakoitzaren hasieran egindako klip labur bat), edozein eszena egon daiteke Programan, eta RAM edo CPU gutxi erabiltzen du. OBSren RTMP edo RTMPS irteera behar du, Enhanced Broadcasting barne (ez SRT edo WHIP). Zuzenean zaudela markatzen baduzu, hurrengo zuzenekotik aurrera aplikatzen da."
Dock.ApplyTo.Locked="Itzali delay-a hau aldatzeko."
Dock.ApplyTo.Unavailable="Oraindik ez dago erabilgarri sistema honetan."
