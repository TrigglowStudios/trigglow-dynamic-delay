# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream e vertical"
Dock.Multistream.Tooltip="Co delay en todo OBS (esta caixa desmarcada), todas as saídas do teu lenzo principal tamén van con delay: Aitum Multistream, Multiple RTMP Outputs e calquera outra cousa que codifique o que mostra OBS, e a escena dun lenzo de Aitum Vertical recibe o mesmo delay. Con “Aplicar o delay só á emisión”, a emisión propia de OBS e a de Aitum Vertical pasan polo delay; as saídas que inician os plugins de multistream saen en directo, e este panel lístaas mentres funcionan. Un servizo que recibe unha emisión e a reenvía (Restream.io, Streamlabs Multistream, Trigglow Multistream) funciona cos dous modos."
Dock.ApplyTo.Stream="Aplicar o delay só á emisión (a gravación e a vista previa seguen en directo)"
Dock.ApplyTo.Hint="Pouca RAM, e os espectadores seguen vendo a escena de carga mentres se acumula o delay, pero a túa gravación non vai con delay."
Dock.ApplyTo.Tooltip="Desmarcada (por defecto): o delay aplícase a todo OBS. A túa escena de carga móstrase mentres se acumula; despois, o directo e a túa gravación van con delay. Marcada: só se atrasa o que vai á túa plataforma. A gravación, a memoria temporal de reprodución e a vista previa de OBS seguen en directo, os espectadores ven a escena de carga mentres se acumula o delay (un clip curto que se prepara ao comezo de cada directo), calquera escena pode estar no Programa e usa pouca RAM e CPU. Precisa a saída RTMP ou RTMPS de OBS, Enhanced Broadcasting incluído (non SRT nin WHIP). Se a marcas en pleno directo, aplícase desde o teu próximo directo."
Dock.ApplyTo.Locked="Desactiva o delay para cambialo."
Dock.ApplyTo.Unavailable="Aínda non está dispoñible neste sistema."
