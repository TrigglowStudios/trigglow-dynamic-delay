# --- Dock: buffer degradation notice (status card, while the delay runs) ---
# Shown while the buffer runs below full quality to keep up with the computer;
# the delay itself never changes. Title, then one of the four sentences below.
Dock.Health.Title="Calidade do búfer reducida"
# %1×%2 buffered now, %3×%4 the full size, %5 the cause (Dock.Health.Cause.*), %6 the delay in seconds.
Dock.Health.Resolution="O búfer garda a %1×%2 en vez de %3×%4 porque %5. O teu delay de %6 s segue intacto."
# %1 fps captured now, %2 fps the full rate, %3 the cause, %4 the delay in seconds.
Dock.Health.FrameRate="O búfer captura %1 fps en vez de %2 fps porque %3. O teu delay de %4 s segue intacto."
# Both lowered: %1×%2 at %3 fps now, %4×%5 at %6 fps full, %7 the cause, %8 the delay in seconds.
Dock.Health.Both="O búfer garda a %1×%2 e %3 fps en vez de %4×%5 e %6 fps porque %7. O teu delay de %8 s segue intacto."
# Lowered in some other way: %1 the cause, %2 the delay in seconds.
Dock.Health.Other="O búfer alixeirouse porque %1. O teu delay de %2 s segue intacto."
Dock.Health.Cause.Graphics="o fío gráfico de OBS vai moi cargado"
Dock.Health.Cause.Encode="comprimir os fotogramas consome moita CPU"
Dock.Health.Cause.Decode="descomprimir os fotogramas consome moita CPU"
Dock.Health.Cause.Other="o equipo vai moi cargado"
# Fine print under the notice, only with a rate above 0 (over the last 10 s).
# Either shows on stream as a repeated frame, never as a change of the delay.
Dock.Health.Repeated="%1 fotogramas repetidos por minuto"
Dock.Health.Dropped="%1 fotogramas perdidos por minuto"
Dock.Health.RepeatedDropped="%1 fotogramas repetidos e %2 perdidos por minuto"
# Announced to screen readers when the notice goes away with the delay still on.
Dock.Health.Restored="O búfer volve á calidade completa."

