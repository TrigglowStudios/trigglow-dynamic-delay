Stream.Buffer.Help="Onde se gardan os segundos retidos para o delay. Memoria: todo na RAM, uns 45 MB por minuto a 6 Mbps; as subidas son ao instante ata o teu delay, presets e regras de escena. Disco: os segundos máis antigos van a un ficheiro temporal cifrado que se elimina cando remata o directo; a RAM queda nuns 15 MB e toda subida ata 600 s é ao instante, pero todo o directo se escribe no disco (uns 2,7 GB por hora a 6 Mbps). Automático escolle Memoria nun SSD, para aforrarlle as escrituras constantes, e Disco nun disco duro. Os cambios aplícanse ao próximo directo."
