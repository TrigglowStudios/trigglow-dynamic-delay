PluginName="Trigglow Dynamic Delay"

# Estilo: segunda persona, frases cortas, mayúsculas solo de frase (las
# mayúsculas de titulares y botones las pone la tipografía, nunca la cadena),
# sin glifos como iconos (el dock dibuja iconos SVG), "…" como un carácter,
# "30 s" con espacio duro, "×" en resoluciones y tildes completas. "Dynamic
# Delay" es el nombre del producto y no se traduce; "delay" y "directo" como
# en la web en español. Los nombres de los objetos que el plugin crea en OBS
# (escena, filtros, fuente del overlay) NO están aquí: OBS los busca por
# nombre, así que son constantes en inglés en src/auto-names.hpp.

# --- Filtros (nombre del tipo de filtro en el diálogo Filtros de OBS) ---
Filter.VideoDelay.Name="Trigglow: Buffer de delay de vídeo"
Filter.AudioDelay.Name="Trigglow: Buffer de delay de audio"
# Propiedades de los filtros (diálogo Filtros de OBS): el dock gestiona los dos filtros, así que no tienen campos.
Filter.VideoDelay.Managed="Lo gestiona el dock de Trigglow Dynamic Delay: el delay y la calidad mínima se eligen allí, y el delay se activa y desactiva desde allí."
Filter.AudioDelay.Managed="Lo gestiona el dock de Trigglow Dynamic Delay: sigue al delay del vídeo. Activa o desactiva el delay desde el dock."

