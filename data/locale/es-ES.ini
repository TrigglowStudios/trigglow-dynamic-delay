Dock.ApplyTo.Tooltip="Desmarcado (por defecto): el delay se aplica a todo OBS. Tu escena de carga se muestra mientras se acumula; después, el directo y tu grabación van con delay. Marcado: solo se retrasa lo que va a tu plataforma. La grabación, el Replay Buffer y la vista previa de OBS siguen en directo, no hay escena de carga, puedes poner cualquier escena en el Programa y usa poca RAM y CPU. Necesita la salida RTMP o RTMPS de OBS (no SRT, WHIP ni Enhanced Broadcasting). Si lo marcas en pleno directo, se aplica desde tu próximo directo."
