# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="%1 캔버스에도 딜레이가 적용돼요. OBS는 모든 캔버스에 같은 오디오를 보내기 때문에, 그 캔버스가 표시하는 장면(그리고 딜레이 장면과 이름이 같은 그 캔버스의 장면)에 별도의 비디오 버퍼가 생겨요. 딜레이가 켜진 동안 RAM, CPU, GPU를 약 두 배 사용해요. 그 버퍼가 채워지는 동안, 그리고 그 캔버스가 장면을 전환할 때마다 딜레이 시간만큼 검은 화면이 표시돼요. 이를 피하려면 그 캔버스를 방송에서 빼세요."

