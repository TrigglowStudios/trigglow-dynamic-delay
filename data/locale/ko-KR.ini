Stream.Buffer.Help="딜레이를 위해 붙잡아 둔 초를 보관하는 곳이에요. 메모리: 전부 RAM에 보관하며 6 Mbps에서 분당 약 45 MB를 써요. 딜레이, 프리셋, 장면 규칙에 설정한 값까지는 즉시 늘릴 수 있어요. 디스크: 오래된 초는 방송이 끝나면 삭제되는 암호화된 임시 파일로 옮겨져요. RAM은 약 15 MB로 유지되고 600 초까지 언제든 즉시 늘릴 수 있지만, 방송 전체가 디스크에 기록돼요(6 Mbps에서 시간당 약 2.7 GB). 자동은 SSD에서는 계속되는 쓰기를 피하려고 메모리를, 하드 드라이브에서는 디스크를 선택해요. 변경 사항은 다음 방송부터 적용돼요."
