Stream.Warn.other_multirtmp="Multiple RTMP Outputs가 출력 %1개를 딜레이 없이 실시간으로 보내고 있어요. OBS 자체 방송만 딜레이를 거쳐요. 출력을 포함해 OBS 전체에 딜레이를 적용하려면 옵션에서 “딜레이를 방송에만 적용”을 선택 해제하세요."
Stream.Warn.other_vertical="Aitum Vertical이 캔버스를 딜레이 없이 방송하고 있어요. 서버가 방송에만 적용하는 딜레이에 필요한 RTMP나 RTMPS가 아니에요. 세로 캔버스를 포함해 OBS 전체에 딜레이를 적용하려면 옵션에서 “딜레이를 방송에만 적용”을 선택 해제하세요."
