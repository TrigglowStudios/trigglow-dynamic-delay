# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream과 세로 방송"
Dock.Multistream.Tooltip="딜레이를 OBS 전체에 적용하면(이 상자를 끈 상태) 기본 캔버스의 모든 출력에도 딜레이가 적용돼요. Aitum Multistream, Multiple RTMP Outputs 등 OBS가 표시하는 화면을 인코딩하는 모든 것이 해당되고, Aitum Vertical 캔버스의 장면에도 같은 딜레이가 적용돼요. “딜레이를 방송에만 적용”을 켜면 OBS 자체 방송과 Aitum Vertical의 방송이 딜레이를 거쳐요. 멀티스트림 플러그인이 시작한 출력은 실시간으로 나가며, 실행되는 동안 이 패널에 표시돼요. 방송 하나를 받아 다시 보내 주는 서비스(Restream.io, Streamlabs Multistream, Trigglow Multistream)는 두 방식 모두에서 작동해요."
Dock.ApplyTo.Stream="딜레이를 방송에만 적용 (녹화와 미리보기는 실시간 유지)"
Dock.ApplyTo.Hint="RAM을 적게 쓰고, 딜레이가 쌓이는 동안 시청자에게 로딩 장면이 그대로 표시되지만 녹화에는 딜레이가 적용되지 않아요."
Dock.ApplyTo.Tooltip="끔(기본값): 딜레이가 OBS 전체에 적용돼요. 딜레이가 쌓이는 동안 로딩 장면이 표시되고, 그 뒤에는 방송과 녹화 모두 딜레이돼요. 켬: 플랫폼으로 나가는 것에만 딜레이가 적용돼요. 녹화, 리플레이 버퍼, OBS 미리보기는 실시간으로 유지되고, 딜레이가 쌓이는 동안 시청자에게 로딩 장면(방송을 시작할 때마다 만드는 짧은 클립)이 표시되며, 프로그램에는 어떤 장면이든 둘 수 있고, RAM과 CPU를 적게 써요. OBS의 RTMP 또는 RTMPS 출력이 필요하며 Enhanced Broadcasting도 포함돼요(SRT와 WHIP는 제외). 방송 중에 선택하면 다음 방송부터 적용돼요."
Dock.ApplyTo.Locked="변경하려면 딜레이를 끄세요."
Dock.ApplyTo.Unavailable="이 시스템에서는 아직 사용할 수 없어요."
