# sends the same audio to every canvas, so that canvas's video is delayed too.
Dock.Canvas.Title="El delay usarà vora el doble de recursos"
# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="El llenç %1 també es retarda: OBS envia el mateix àudio a tots els llenços, així que l'escena que mostra (i qualsevol de les seues escenes amb el nom d'una escena amb delay) té el seu propi búfer de vídeo. Compta amb vora el doble de RAM, CPU i GPU mentre el delay estiga actiu. Mentre s'ompli eixe búfer, i cada vegada que eixe llenç canvia d'escena, es veu en negre durant el delay. Per a evitar-ho, lleva eixe llenç del teu directe."

