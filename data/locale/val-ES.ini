Trigi.Notice.Item1="Trigi és l'assistent de suport amb IA de Trigglow. Es pot equivocar: revisa el que et diga abans de canviar la teua configuració."
Trigi.Notice.Item2="Trigglow i un proveïdor d'IA indicat en la Política de Privacitat processen els teus missatges i, si ho actives, les dades tècniques d'OBS (només xifres i estats; mai noms d'escenes, rutes ni claus)."
Trigi.Notice.Item3="Guardem les converses fins a 12 mesos per a donar-te suport i millorar el servici."
Trigi.Notice.Item4="No escrigues contrasenyes, claus d'emissió, URLs d'overlay ni dades de pagament."
Trigi.Notice.Item5="El teu registre d'OBS no s'envia mai a la IA. Només s'adjunta a un tiquet si tu ho elegixes."
Trigi.Notice.Item6="Sempre pots escriure directament a l'equip de suport."
Trigi.Notice.Privacy="Política de Privacitat"
Trigi.Notice.PrivacyName="Política de Privacitat (obri el navegador)"
Trigi.Notice.Accept="Entés"
Trigi.Notice.Decline="Preferisc escriure a l'equip"
