# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream i vertical"
Dock.Multistream.Tooltip="Amb el delay en tot OBS (esta casella desmarcada), totes les eixides del teu llenç principal també van amb delay: Aitum Multistream, Multiple RTMP Outputs i qualsevol altra cosa que codifique el que mostra OBS, i l'escena d'un llenç d'Aitum Vertical rep el mateix delay. Amb “Aplicar el delay només al directe”, el directe propi d'OBS i el d'Aitum Vertical passen pel delay; les eixides que inicien els plugins de multistream ixen sense delay, i este panell les mostra mentre funcionen. Un servici que rep un directe i el reenvia (Restream.io, Streamlabs Multistream, Trigglow Multistream) funciona amb els dos."
Dock.ApplyTo.Stream="Aplicar el delay només al directe (l'enregistrament i la vista prèvia no es retarden)"
Dock.ApplyTo.Hint="Poca RAM, i els espectadors continuen veient l'escena de càrrega mentre s'acumula el delay, però el teu enregistrament no es retarda."
Dock.ApplyTo.Tooltip="Desmarcat (per defecte): el delay s'aplica a tot OBS. La teua escena de càrrega es mostra mentre s'acumula; després, el directe i el teu enregistrament van amb delay. Marcat: només es retarda el que va a la teua plataforma. L'enregistrament, la memòria intermèdia de reproducció i la vista prèvia d'OBS no es retarden, els espectadors veuen l'escena de càrrega mentre s'acumula el delay (un clip curt que es prepara en començar cada directe), pots posar qualsevol escena en el Programa i usa poca RAM i CPU. Necessita l'eixida RTMP o RTMPS d'OBS, Enhanced Broadcasting inclòs (no SRT ni WHIP). Si el marques en ple directe, s'aplica des del teu pròxim directe."
Dock.ApplyTo.Locked="Desactiva el delay per a canviar-ho."
Dock.ApplyTo.Unavailable="Encara no està disponible en este sistema."
