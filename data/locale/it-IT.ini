Stream.Buffer.Help="Dove vengono tenuti i secondi trattenuti per il delay. Memoria: tutto in RAM, circa 45 MB al minuto a 6 Mbps; gli aumenti sono immediati fino al tuo delay, ai preset e alle regole per scena. Disco: i secondi più vecchi vanno in un file temporaneo cifrato, eliminato a fine stream; la RAM resta sui 15 MB e ogni aumento fino a 600 s è immediato, ma tutto lo stream viene scritto su disco (circa 2,7 GB all'ora a 6 Mbps). Automatico sceglie Memoria su un SSD, per risparmiargli le scritture continue, e Disco su un disco rigido. Le modifiche valgono dal prossimo stream."
