Dock.Health.Cause.Other="il computer è sotto forte carico"
# Fine print under the notice, only with a rate above 0 (over the last 10 s).
# Either shows on stream as a repeated frame, never as a change of the delay.
Dock.Health.Repeated="%1 fotogrammi ripetuti al minuto"
Dock.Health.Dropped="%1 fotogrammi persi al minuto"
Dock.Health.RepeatedDropped="%1 fotogrammi ripetuti e %2 persi al minuto"
# Announced to screen readers when the notice goes away with the delay still on.
Dock.Health.Restored="Il buffer è tornato alla qualità piena."

