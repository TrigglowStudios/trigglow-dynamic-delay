# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream e verticale"
Dock.Multistream.Tooltip="Con il delay su tutto OBS (questa casella disattivata), anche ogni uscita della tua tela principale ha il delay: Aitum Multistream, Multiple RTMP Outputs e tutto ciò che codifica quello che OBS mostra; la scena su una tela di Aitum Vertical riceve lo stesso delay. Con “Applica il delay solo allo stream”, lo stream di OBS e quello di Aitum Vertical passano dal delay; le uscite avviate dai plugin di multistream escono in tempo reale, e questo pannello le elenca mentre sono attive. Un servizio che riceve un solo stream e lo inoltra (Restream.io, Streamlabs Multistream, Trigglow Multistream) funziona con entrambe le modalità."
Dock.ApplyTo.Stream="Applica il delay solo allo stream (registrazione e anteprima restano in tempo reale)"
Dock.ApplyTo.Hint="Poca RAM, e gli spettatori vedono comunque la scena di caricamento mentre il delay si accumula, ma la registrazione non ha il delay."
Dock.ApplyTo.Tooltip="Disattivato (predefinito): il delay si applica a tutto OBS. La tua scena di caricamento si vede mentre si accumula, poi stream e registrazione hanno entrambi il delay. Attivato: ha il delay solo ciò che va alla tua piattaforma. La registrazione, il buffer di replay e l'anteprima di OBS restano in tempo reale, gli spettatori vedono la scena di caricamento mentre il delay si accumula (una breve clip creata all'inizio di ogni stream), su Programma può esserci qualsiasi scena e usa poca RAM e CPU. Richiede l'uscita RTMP o RTMPS di OBS, Enhanced Broadcasting incluso (non SRT né WHIP). Se lo spunti mentre sei in live, vale dal tuo prossimo stream."
Dock.ApplyTo.Locked="Disattiva il delay per cambiarlo."
Dock.ApplyTo.Unavailable="Non ancora disponibile su questo sistema."
