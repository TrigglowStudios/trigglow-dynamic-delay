# --- Dock: buffer degradation notice (status card, while the delay runs) ---
# Shown while the buffer runs below full quality to keep up with the computer;
# the delay itself never changes. Title, then one of the four sentences below.
Dock.Health.Title="Qualità del buffer ridotta"
# %1×%2 buffered now, %3×%4 the full size, %5 the cause (Dock.Health.Cause.*), %6 the delay in seconds.
Dock.Health.Resolution="Il buffer salva a %1×%2 invece di %3×%4 perché %5. Il tuo delay di %6 s non cambia."
# %1 fps captured now, %2 fps the full rate, %3 the cause, %4 the delay in seconds.
Dock.Health.FrameRate="Il buffer cattura %1 fps invece di %2 fps perché %3. Il tuo delay di %4 s non cambia."
# Both lowered: %1×%2 at %3 fps now, %4×%5 at %6 fps full, %7 the cause, %8 the delay in seconds.
Dock.Health.Both="Il buffer salva a %1×%2 e %3 fps invece di %4×%5 e %6 fps perché %7. Il tuo delay di %8 s non cambia."
# Lowered in some other way: %1 the cause, %2 the delay in seconds.
Dock.Health.Other="Il buffer è stato alleggerito perché %1. Il tuo delay di %2 s non cambia."
Dock.Health.Cause.Graphics="il thread grafico di OBS è sotto forte carico"
Dock.Health.Cause.Encode="comprimere i fotogrammi richiede molta CPU"
