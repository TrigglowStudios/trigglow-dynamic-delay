# --- Dock: other-canvas notice (own card under the status card) ---
# Shown when a delayed scene is also on another canvas (Aitum Vertical...). OBS
# sends the same audio to every canvas, so that canvas's video is delayed too.
Dock.Canvas.Title="Das Delay braucht etwa doppelt so viele Ressourcen"
# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="Die Leinwand %1 bekommt das Delay auch: OBS sendet dasselbe Audio an jede Leinwand, also erhält die Szene, die sie zeigt (und jede ihrer Szenen, die wie eine Szene mit Delay heißt), einen eigenen Videopuffer. Rechne bei eingeschaltetem Delay mit etwa doppelt so viel RAM, CPU und GPU. Während sich dieser Puffer füllt und bei jedem Szenenwechsel dieser Leinwand bleibt sie für die Dauer des Delays schwarz. Um das zu vermeiden, nimm diese Leinwand aus deinem Stream."

