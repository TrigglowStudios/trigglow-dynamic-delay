# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream und Hochformat"
Dock.Multistream.Tooltip="Liegt das Delay auf ganz OBS (dieses Kästchen aus), bekommt auch jede Ausgabe deiner Hauptleinwand das Delay: Aitum Multistream, Multiple RTMP Outputs und alles andere, das encodiert, was OBS zeigt; die Szene auf einer Aitum Vertical-Leinwand bekommt dasselbe Delay. Mit „Delay nur auf den Stream anwenden“ laufen der eigene Stream von OBS und der Stream von Aitum Vertical durch das Delay; die Ausgaben, die Multistream-Plugins starten, gehen live raus, und dieses Panel listet sie auf, solange sie laufen. Ein Dienst, der einen Stream annimmt und weiterleitet (Restream.io, Streamlabs Multistream, Trigglow Multistream), funktioniert mit beidem."
Dock.ApplyTo.Stream="Delay nur auf den Stream anwenden (Aufnahme und Vorschau bleiben live)"
Dock.ApplyTo.Hint="Wenig RAM, und die Zuschauer sehen weiter die Ladeszene, während sich das Delay aufbaut, aber deine Aufnahme hat kein Delay."
Dock.ApplyTo.Tooltip="Aus (Standard): Das Delay gilt für ganz OBS. Deine Ladeszene läuft, während es sich aufbaut, danach haben der Stream und deine Aufnahme beide das Delay. An: Nur was an deine Plattform geht, bekommt das Delay. Aufnahme, Replaypuffer und die Vorschau von OBS bleiben live, die Zuschauer sehen die Ladeszene, während sich das Delay aufbaut (ein kurzer Clip, der zu Beginn jedes Streams erstellt wird), jede Szene kann auf Programm liegen, und es braucht wenig RAM oder CPU. Braucht die RTMP- oder RTMPS-Ausgabe von OBS, Enhanced Broadcasting eingeschlossen (nicht SRT oder WHIP). Kreuzt du es an, während du live bist, gilt es ab deinem nächsten Stream."
Dock.ApplyTo.Locked="Schalte das Delay aus, um das zu ändern."
Dock.ApplyTo.Unavailable="Auf diesem System noch nicht verfügbar."
