PluginName="Trigglow Dynamic Delay"

# Style: second person, short sentences, sentence case (capitals come from the
# UI's fonts, never from the string), no glyphs as icons (the dock draws SVG
# icons), "…" as one character, "30 s" with a no-break space, "×" in
# resolutions. "Dynamic Delay" is the product name and is never translated.
# The names of the objects the plugin creates in OBS (scene, filters, overlay
# source) are NOT here: OBS finds them by name, so they are fixed English
# constants in src/auto-names.hpp.

# --- Filters (filter type names in OBS's Filters dialog) ---
Filter.VideoDelay.Name="Trigglow: 视频延迟缓冲"
Filter.AudioDelay.Name="Trigglow: 音频延迟缓冲"
# The filters' properties (OBS's Filters dialog): the dock manages both filters, so they have no fields.
Filter.VideoDelay.Managed="由 Trigglow Dynamic Delay 面板管理：延迟和最低画质都在面板中设置，延迟的开启和关闭也在面板中操作。"
Filter.AudioDelay.Managed="由 Trigglow Dynamic Delay 面板管理：跟随视频延迟。请在面板中开启或关闭延迟。"

