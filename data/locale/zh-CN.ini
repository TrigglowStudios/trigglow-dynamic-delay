# --- Dock: buffer degradation notice (status card, while the delay runs) ---
# Shown while the buffer runs below full quality to keep up with the computer;
# the delay itself never changes. Title, then one of the four sentences below.
Dock.Health.Title="缓冲画质已降低"
# %1×%2 buffered now, %3×%4 the full size, %5 the cause (Dock.Health.Cause.*), %6 the delay in seconds.
Dock.Health.Resolution="当前以 %1×%2 而非 %3×%4 缓冲，因为%5。你的 %6 s 延迟保持不变。"
# %1 fps captured now, %2 fps the full rate, %3 the cause, %4 the delay in seconds.
Dock.Health.FrameRate="当前以 %1 fps 而非 %2 fps 采集，因为%3。你的 %4 s 延迟保持不变。"
# Both lowered: %1×%2 at %3 fps now, %4×%5 at %6 fps full, %7 the cause, %8 the delay in seconds.
Dock.Health.Both="当前以 %1×%2、%3 fps 而非 %4×%5、%6 fps 缓冲，因为%7。你的 %8 s 延迟保持不变。"
# Lowered in some other way: %1 the cause, %2 the delay in seconds.
Dock.Health.Other="缓冲已减轻负担，因为%1。你的 %2 s 延迟保持不变。"
Dock.Health.Cause.Graphics="OBS 的图形线程负载很高"
Dock.Health.Cause.Encode="压缩画面帧占用了大量 CPU"
Dock.Health.Cause.Decode="解压画面帧占用了大量 CPU"
Dock.Health.Cause.Other="电脑负载很高"
# Fine print under the notice, only with a rate above 0 (over the last 10 s).
# Either shows on stream as a repeated frame, never as a change of the delay.
Dock.Health.Repeated="每分钟重复 %1 帧"
Dock.Health.Dropped="每分钟丢弃 %1 帧"
Dock.Health.RepeatedDropped="每分钟重复 %1 帧、丢弃 %2 帧"
# Announced to screen readers when the notice goes away with the delay still on.
Dock.Health.Restored="缓冲已恢复完整画质。"

