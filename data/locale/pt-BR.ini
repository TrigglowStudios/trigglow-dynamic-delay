Stream.Buffer.Help="Onde ficam os segundos retidos para o delay. Memória: tudo na RAM, cerca de 45 MB por minuto a 6 Mbps; os aumentos são instantâneos até o seu delay, predefinições e regras de cena. Disco: os segundos mais antigos vão para um arquivo temporário criptografado, apagado quando a transmissão termina; a RAM fica em cerca de 15 MB e todo aumento até 600 s é instantâneo, mas a transmissão inteira é gravada no disco (cerca de 2,7 GB por hora a 6 Mbps). Automático escolhe Memória em um SSD, para poupá-lo de gravações constantes, e Disco em um HD. As mudanças valem a partir da próxima transmissão."
