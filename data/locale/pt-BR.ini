Dock.ApplyTo.Hint="Sem cena de carregamento e com pouca RAM, mas a gravação não é atrasada."
Dock.ApplyTo.Tooltip="Desmarcado (padrão): o delay se aplica a todo o OBS. A cena de carregamento aparece enquanto ele se acumula; depois, a live e a sua gravação ficam com delay. Marcado: só o que vai para a sua plataforma é atrasado. A gravação, o buffer de repetição e a pré-visualização do OBS continuam ao vivo, não há cena de carregamento, qualquer cena pode ficar no Programa e usa pouca RAM e CPU. Precisa da saída RTMP ou RTMPS do OBS (não SRT, WHIP nem Enhanced Broadcasting). Se marcar durante a live, vale a partir da próxima."
Dock.ApplyTo.Locked="Desative o delay para alterar."
Dock.ApplyTo.Unavailable="Ainda não disponível neste sistema."
