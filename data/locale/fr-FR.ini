# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream et vertical"
Dock.Multistream.Tooltip="Avec le délai sur tout OBS (cette case décochée), toutes les sorties de votre canevas principal sont retardées elles aussi : Aitum Multistream, Multiple RTMP Outputs et tout ce qui encode ce qu'OBS affiche, et la scène d'un canevas Aitum Vertical reçoit le même délai. Avec « Appliquer le délai uniquement au stream », le stream d'OBS et celui d'Aitum Vertical passent par le délai ; les sorties lancées par les plugins de multistream partent en direct, et ce panneau les liste tant qu'elles tournent. Un service qui reçoit un seul stream et le retransmet (Restream.io, Streamlabs Multistream, Trigglow Multistream) fonctionne avec les deux."
Dock.ApplyTo.Stream="Appliquer le délai uniquement au stream (l'enregistrement et l'aperçu restent en direct)"
Dock.ApplyTo.Hint="Peu de RAM, et les spectateurs voient quand même la scène de chargement pendant que le délai s'accumule, mais votre enregistrement n'est pas retardé."
Dock.ApplyTo.Tooltip="Désactivé (par défaut) : le délai s'applique à tout OBS. Votre scène de chargement s'affiche pendant qu'il s'accumule, puis le stream et votre enregistrement sont tous deux retardés. Activé : seul ce qui part vers votre plateforme est retardé. L'enregistrement, le tampon de relecture et l'aperçu d'OBS restent en direct, les spectateurs voient la scène de chargement pendant que le délai s'accumule (un court clip créé au début de chaque stream), n'importe quelle scène peut être sur Programme, et cela utilise peu de RAM et de CPU. Nécessite la sortie RTMP ou RTMPS d'OBS, Enhanced Broadcasting compris (pas SRT ni WHIP). Si vous cochez la case en plein live, elle s'applique à partir de votre prochain stream."
Dock.ApplyTo.Locked="Désactivez le délai pour la modifier."
Dock.ApplyTo.Unavailable="Pas encore disponible sur ce système."
