# Shown when a delayed scene is also on another canvas (Aitum Vertical...). OBS
# sends the same audio to every canvas, so that canvas's video is delayed too.
Dock.Canvas.Title="Le délai utilisera environ deux fois plus de ressources"
# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="Le canevas %1 est lui aussi retardé : OBS envoie le même audio à tous les canevas, donc la scène qu'il affiche (et toute scène à lui portant le nom d'une scène avec délai) reçoit son propre tampon vidéo. Prévoyez environ deux fois plus de RAM, de CPU et de GPU pendant que le délai est activé. Pendant que ce tampon se remplit, et à chaque changement de scène de ce canevas, il affiche du noir pendant la durée du délai. Pour l'éviter, retirez ce canevas de votre stream."

