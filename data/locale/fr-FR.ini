Stream.Buffer.Help="Où sont conservées les secondes retenues pour le délai. Mémoire : tout en RAM, environ 45 Mo par minute à 6 Mbps ; les hausses sont instantanées jusqu'à votre délai, vos préréglages et vos règles de scène. Disque : les secondes les plus anciennes vont dans un fichier temporaire chiffré, supprimé à la fin du stream ; la RAM reste autour de 15 Mo et chaque hausse jusqu'à 600 s est instantanée, mais tout le stream est écrit sur le disque (environ 2,7 Go par heure à 6 Mbps). Automatique choisit Mémoire sur un SSD, pour lui épargner les écritures constantes, et Disque sur un disque dur. Les changements s'appliquent au prochain stream."
