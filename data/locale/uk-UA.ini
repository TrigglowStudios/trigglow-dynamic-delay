# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream і вертикальний формат"
Dock.Multistream.Tooltip="Коли затримка діє на всю OBS (цю позначку знято), затримується і кожен вивід основного полотна: Aitum Multistream, Multiple RTMP Outputs і все інше, що кодує те, що показує OBS, а сцена на полотні Aitum Vertical отримує ту саму затримку. З параметром «Застосовувати затримку лише до трансляції» через затримку проходять власна трансляція OBS і трансляція Aitum Vertical; виводи, які запускають плагіни мультистриму, ідуть наживо, і ця панель показує їх, поки вони працюють. Сервіс, який приймає одну трансляцію та пересилає її далі (Restream.io, Streamlabs Multistream, Trigglow Multistream), працює в обох режимах."
Dock.ApplyTo.Stream="Застосовувати затримку лише до трансляції (запис і попередній перегляд залишаються наживо)"
Dock.ApplyTo.Hint="Мало ОЗП, і глядачі однаково бачать сцену завантаження, поки накопичується затримка, але ваш запис не затримується."
Dock.ApplyTo.Tooltip="Вимкнено (типово): затримка застосовується до всієї OBS. Поки вона накопичується, показується ваша сцена завантаження, далі затримуються і трансляція, і запис. Увімкнено: затримується лише те, що йде на вашу платформу. Запис, буфер повторів і попередній перегляд OBS залишаються наживо, глядачі бачать сцену завантаження, поки накопичується затримка (короткий кліп, який створюється на початку кожної трансляції), у «Програмі» може бути будь-яка сцена, а ОЗП і ЦП використовується мало. Потрібен вивід OBS RTMP або RTMPS, зокрема Enhanced Broadcasting (не SRT і не WHIP). Якщо поставити позначку під час ефіру, вона подіє з наступної трансляції."
Dock.ApplyTo.Locked="Вимкніть затримку, щоб змінити це."
Dock.ApplyTo.Unavailable="На цій системі поки недоступно."
