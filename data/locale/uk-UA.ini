Filter.AudioDelay.Name="Trigglow: Буфер затримки аудіо"
# The filters' properties (OBS's Filters dialog): the dock manages both filters, so they have no fields.
Filter.VideoDelay.Managed="Цим керує панель Trigglow Dynamic Delay: там задаються затримка й мінімальна якість, там же затримка вмикається та вимикається."
Filter.AudioDelay.Managed="Цим керує панель Trigglow Dynamic Delay: фільтр повторює затримку відео. Вмикайте та вимикайте затримку з панелі."

