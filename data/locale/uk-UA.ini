Stream.Warn.other_vertical="Aitum Vertical транслює своє полотно без затримки: його сервер не RTMP і не RTMPS, а це потрібно для затримки лише трансляції. Зніміть позначку «Застосовувати затримку лише до трансляції» в розділі «Параметри», щоб затримувати всю OBS разом із вертикальним полотном."
Stream.Warn.other_other="Інший плагін надсилає виводів трансляції наживо, без затримки: %1. Через неї проходить лише власна трансляція OBS. Зніміть позначку «Застосовувати затримку лише до трансляції» в розділі «Параметри», щоб затримувати всю OBS разом із виводами."
