Dock.Canvas.Title="El delay farà servir aproximadament el doble de recursos"
# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="El llenç %1 també va amb delay: OBS envia el mateix àudio a tots els llenços, així que l'escena que mostra (i qualsevol de les seves escenes amb el nom d'una escena amb delay) té el seu propi búfer de vídeo. Compta amb aproximadament el doble de RAM, CPU i GPU mentre el delay estigui actiu. Mentre s'omple aquest búfer, i cada vegada que aquest llenç canvia d'escena, es veu en negre durant el delay. Per evitar-ho, treu aquest llenç del directe."

