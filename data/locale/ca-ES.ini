# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream i vertical"
Dock.Multistream.Tooltip="Amb el delay a tot OBS (aquesta casella desactivada), totes les sortides del teu llenç principal també van amb delay: Aitum Multistream, Multiple RTMP Outputs i qualsevol altra cosa que codifiqui el que mostra OBS, i l'escena d'un llenç d'Aitum Vertical rep el mateix delay. Amb “Aplica el delay només al directe”, el directe propi d'OBS i el d'Aitum Vertical passen pel delay; les sortides que inicien els connectors de multistream surten en directe, i aquest acoblador les llista mentre funcionen. Un servei que rep un directe i el reenvia (Restream.io, Streamlabs Multistream, Trigglow Multistream) funciona amb tots dos."
Dock.ApplyTo.Stream="Aplica el delay només al directe (l'enregistrament i la vista prèvia no s'endarrereixen)"
Dock.ApplyTo.Hint="Poca RAM, i la teva audiència continua veient l'escena de càrrega mentre s'acumula el delay, però el teu enregistrament no s'endarrereix."
Dock.ApplyTo.Tooltip="Desmarcat (per defecte): el delay s'aplica a tot OBS. La teva escena de càrrega es mostra mentre s'acumula; després, el directe i el teu enregistrament van amb delay. Marcat: només s'endarrereix el que va a la teva plataforma. L'enregistrament, la memòria intermèdia de reproducció i la vista prèvia d'OBS continuen en directe, la teva audiència veu l'escena de càrrega mentre s'acumula el delay (un clip curt que es prepara a l'inici de cada directe), pots posar qualsevol escena al Programa i fa servir poca RAM i CPU. Necessita la sortida RTMP o RTMPS d'OBS, Enhanced Broadcasting inclòs (no SRT ni WHIP). Si el marques en ple directe, s'aplica a partir del teu pròxim directe."
Dock.ApplyTo.Locked="Desactiva el delay per canviar-ho."
Dock.ApplyTo.Unavailable="Encara no està disponible en aquest sistema."
