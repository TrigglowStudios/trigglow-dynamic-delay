Hotkey.Toggle="Trigglow: Dynamic Delay のオン/オフ切り替え"
Hotkey.Enable="Trigglow: Dynamic Delay をオンにする"
Hotkey.Disable="Trigglow: Dynamic Delay をオフにする"

