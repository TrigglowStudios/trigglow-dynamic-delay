Dock.Multistream.Title="マルチ配信と縦型配信"
Dock.Multistream.Tooltip="OBS 全体にディレイをかける場合（このチェックがオフ）、メインキャンバスのすべての出力にもディレイがかかります：Aitum Multistream、Multiple RTMP Outputs など、OBS の表示内容をエンコードするものすべてが対象で、Aitum Vertical キャンバスのシーンにも同じディレイがかかります。「ディレイを配信のみに適用する」の場合、OBS 本体の配信と Aitum Vertical の配信がディレイを通ります。マルチ配信プラグインが開始する出力はライブのまま送信され、実行中はこのパネルに一覧表示されます。1 つの配信を受け取って転送するサービス（Restream.io、Streamlabs Multistream、Trigglow Multistream）は、どちらでも動作します。"
Dock.ApplyTo.Stream="ディレイを配信のみに適用する（録画とプレビューはライブのまま）"
Dock.ApplyTo.Hint="RAM の使用量が少なく、ディレイがたまるまでの間は視聴者にローディングシーンが表示されますが、録画にはディレイがかかりません。"
Dock.ApplyTo.Tooltip="オフ（デフォルト）：ディレイは OBS 全体に適用されます。たまるまでの間はローディングシーンが表示され、その後は配信と録画の両方にディレイがかかります。オン：プラットフォームに送る内容にのみディレイがかかります。録画、リプレイバッファ、OBS のプレビューはライブのままで、ディレイがたまるまでの間は視聴者にローディングシーン（各配信の開始時に作られる短いクリップ）が表示され、どのシーンでもプログラムに出せて、RAM や CPU の使用量もわずかです。OBS の RTMP または RTMPS 出力が必要です（Enhanced Broadcasting を含みます。SRT や WHIP は不可）。配信中にチェックを入れた場合は、次の配信から適用されます。"
Dock.ApplyTo.Locked="変更するにはディレイをオフにしてください。"
