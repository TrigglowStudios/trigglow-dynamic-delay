Stream.Multi.Tooltip="यह स्ट्रीम, डिले के बाद, आपकी OBS सेवा के अलावा सीधे OBS से उन चैनलों को भेजता है जो आपने trigglow.com पर Multistream में चालू किए हैं। हर चैनल एक अलग अपलोड है, इसलिए आपका कनेक्शन हर चैनल के लिए बिटरेट एक बार उठाता है। चैनल और उनकी स्ट्रीम कुंजियाँ ज़रूरत पड़ने पर आपके Trigglow अकाउंट से पढ़ी जाती हैं और सिर्फ़ मेमोरी में रखी जाती हैं, कभी सेव नहीं होतीं। आपकी अगली स्ट्रीम से लागू होता है।"
