Stream.Buffer.Help="डिले के लिए रोके गए सेकंड कहाँ रखे जाते हैं। मेमोरी: सब RAM में, 6 Mbps पर लगभग 45 MB प्रति मिनट; आपके डिले, प्रीसेट और सीन नियमों तक की बढ़ोतरी तुरंत होती है। डिस्क: पुराने सेकंड एक एन्क्रिप्टेड टेम्प फ़ाइल में जाते हैं, जो स्ट्रीम खत्म होने पर हटा दी जाती है; RAM लगभग 15 MB रहती है और 600 s तक की हर बढ़ोतरी तुरंत होती है, लेकिन पूरी स्ट्रीम डिस्क पर लिखी जाती है (6 Mbps पर लगभग 2.7 GB प्रति घंटा)। ऑटोमैटिक, SSD पर मेमोरी चुनता है ताकि उस पर लगातार लिखना न पड़े, और हार्ड ड्राइव पर डिस्क। बदलाव अगली स्ट्रीम से लागू होते हैं।"
