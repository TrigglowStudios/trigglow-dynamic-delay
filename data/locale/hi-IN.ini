# %1 the canvas name(s), comma-separated.
Dock.Canvas.Body="%1 कैनवास पर भी डिले लगता है: OBS हर कैनवास को एक ही ऑडियो भेजता है, इसलिए वह जो सीन दिखाता है (और उसका कोई भी सीन जिसका नाम डिले वाले सीन जैसा है) उसे अपना अलग वीडियो बफ़र मिलता है। डिले चालू रहते हुए लगभग दोगुनी RAM, CPU और GPU लगेगी। जब तक वह बफ़र भरता है, और हर बार जब वह कैनवास सीन बदलता है, वह डिले जितनी देर काला दिखता है। इससे बचने के लिए उस कैनवास को अपनी स्ट्रीम से हटा दें।"

