Stream.Detail.Idle="तैयार: इसे यहाँ से या अपनी हॉटकी से चालू करें। डिले सिर्फ़ आपके प्लेटफ़ॉर्म को मिलता है: रिकॉर्डिंग, रीप्ले बफ़र और OBS का पूर्वावलोकन लाइव रहते हैं।"
Stream.Detail.Live="डिले किसी भी पल चालू करें: दर्शक पिछले कुछ सेकंड दोबारा देखते हैं, उससे नया कुछ नहीं।"
Stream.Ineligible.protocol="आपकी सेवा RTMP या RTMPS पर स्ट्रीम नहीं करती (SRT, WHIP...), जो सिर्फ़ स्ट्रीम वाले डिले के लिए ज़रूरी है। पूरे OBS को डिले करने के लिए विकल्प में “डिले सिर्फ़ स्ट्रीम पर लगाएँ” से टिक हटाएँ।"
Stream.Ineligible.output="यह स्ट्रीम OBS का RTMP आउटपुट इस्तेमाल नहीं करती। पूरे OBS को डिले करने के लिए विकल्प में “डिले सिर्फ़ स्ट्रीम पर लगाएँ” से टिक हटाएँ।"
Stream.Ineligible.server="आपका स्ट्रीम सर्वर rtmp:// या rtmps:// पता नहीं है। पूरे OBS को डिले करने के लिए विकल्प में “डिले सिर्फ़ स्ट्रीम पर लगाएँ” से टिक हटाएँ।"
Stream.Ineligible.relay="इस स्ट्रीम के लिए सिर्फ़ स्ट्रीम वाला डिले शुरू नहीं हो सका। पूरे OBS को डिले करने के लिए विकल्प में “डिले सिर्फ़ स्ट्रीम पर लगाएँ” से टिक हटाएँ, या समस्या रिपोर्ट करें।"
Stream.Ineligible.unavailable="सिर्फ़ स्ट्रीम वाला डिले इस सिस्टम पर अभी उपलब्ध नहीं है। पूरे OBS को डिले करने के लिए विकल्प में “डिले सिर्फ़ स्ट्रीम पर लगाएँ” से टिक हटाएँ।"
Stream.Ineligible.started="जब आपने “डिले सिर्फ़ स्ट्रीम पर लगाएँ” चुना, तब OBS पहले से स्ट्रीम कर रहा था: यह आपकी अगली स्ट्रीम से लागू होता है। इस स्ट्रीम को डिले करने के लिए विकल्प में इससे टिक हटाएँ।"
