# --- Dock: the (i) next to Advanced: multistream and vertical plugins with each mode (v1.1.0) ---
Dock.Multistream.Title="Multistream और वर्टिकल"
Dock.Multistream.Tooltip="जब डिले पूरे OBS पर लगता है (यह बॉक्स बंद), तो आपके मुख्य कैनवास का हर आउटपुट भी डिले होता है: Aitum Multistream, Multiple RTMP Outputs और बाकी सब कुछ जो OBS में दिख रही चीज़ को एनकोड करता है, और Aitum Vertical कैनवास के सीन पर भी वही डिले लगता है। “डिले सिर्फ़ स्ट्रीम पर लगाएँ” के साथ OBS की अपनी स्ट्रीम और Aitum Vertical की स्ट्रीम डिले से होकर जाती हैं; Multistream प्लगइन जो आउटपुट शुरू करते हैं वे लाइव जाते हैं, और यह पैनल उनके चलते समय उन्हें दिखाता है। जो सेवा एक स्ट्रीम लेकर उसे आगे भेजती है (Restream.io, Streamlabs Multistream, Trigglow Multistream), वह दोनों के साथ काम करती है।"
Dock.ApplyTo.Stream="डिले सिर्फ़ स्ट्रीम पर लगाएँ (रिकॉर्डिंग और पूर्वावलोकन लाइव रहते हैं)"
Dock.ApplyTo.Hint="कम RAM लगती है, और डिले जमा होते समय दर्शकों को लोडिंग सीन फिर भी दिखता है, लेकिन आपकी रिकॉर्डिंग डिले नहीं होती।"
Dock.ApplyTo.Tooltip="बंद (डिफ़ॉल्ट): डिले पूरे OBS पर लगता है। डिले जमा होते समय आपका लोडिंग सीन दिखता है, फिर स्ट्रीम और आपकी रिकॉर्डिंग दोनों डिले होती हैं। चालू: सिर्फ़ वही डिले होता है जो आपके प्लेटफ़ॉर्म पर जाता है। रिकॉर्डिंग, रीप्ले बफ़र और OBS का पूर्वावलोकन लाइव रहते हैं, डिले जमा होते समय दर्शकों को लोडिंग सीन दिखता है (हर स्ट्रीम की शुरुआत में बनी एक छोटी क्लिप), कोई भी सीन कार्यक्रम पर हो सकता है, और RAM या CPU कम लगता है। इसके लिए OBS का RTMP या RTMPS आउटपुट चाहिए, Enhanced Broadcasting भी चलता है (SRT या WHIP नहीं)। अगर आप लाइव रहते हुए इस पर टिक करते हैं, तो यह आपकी अगली स्ट्रीम से लागू होता है।"
Dock.ApplyTo.Locked="इसे बदलने के लिए डिले बंद करें।"
Dock.ApplyTo.Unavailable="इस सिस्टम पर अभी उपलब्ध नहीं है।"
